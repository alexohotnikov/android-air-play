plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.okhotnikov.airplay'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.okhotnikov.airplay'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk {
            abiFilters 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // A home prototype: sign with the debug key so it installs without a keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}

dependencies {
    // ExoPlayer for "play this URL": the platform MediaPlayer's HLS cannot read fMP4 segments (VK Video's, for one).
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    // Colour emoji for track titles: the TV's fonts draw them as flat outlines. Bundled, as the TV may lack
    // Google's downloadable fonts.
    implementation 'androidx.emoji2:emoji2-bundled:1.4.0'
}
