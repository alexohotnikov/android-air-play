plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.okhotnikov.airplay'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.okhotnikov.airplay'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk {
            abiFilters 'armeabi-v7a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // A home prototype: sign with the debug key so it installs without a keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
